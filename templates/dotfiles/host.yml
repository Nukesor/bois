# The enabled traits for this host.
traits:
  - base

# The default directory to where files will be deployed for files in this directory
#target_dir: ~/.dotfiles

# The default permissions for deployed files and directories inside this host directory.
# Can be overwritten on a directory or filebases deeper down the file hierarchy.
#permission_defaults:
#  owner: root
#  group: root
#  file_mode: 0o644
#  directory_mode: 0o755

# Variables that're available in all templates of this host.
# An alternative to the vars.yml file in the host directory.
# Only one of the two may be used.
#vars:
